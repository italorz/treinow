name: treinow
services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    expose: ["80"]
    depends_on:
      api: { condition: service_healthy }
    read_only: true
    tmpfs: ["/var/cache/nginx", "/var/run"]
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api-go/Dockerfile
    command: ["api"]
    env_file: .env
    environment:
      PORT: "3000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "/app/trainow", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]

  worker:
    build:
      context: .
      dockerfile: apps/api-go/Dockerfile
    command: ["worker"]
    env_file: .env
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-treinow}
      POSTGRES_USER: ${POSTGRES_USER:-treinow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-treinow} -d ${POSTGRES_DB:-treinow}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD:-change-me}\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change-me}
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: rclone/rclone:latest
    command:
      - serve
      - s3
      - gdrive:app-storage
      - --addr
      - :9000
      - --auth-key
      - "${MINIO_ACCESS_KEY},${MINIO_SECRET_KEY}"
      - --vfs-cache-mode
      - full
      - --vfs-cache-max-age
      - 168h
      - --vfs-cache-max-size
      - 2G
      - --dir-cache-time
      - 24h
    environment:
      RCLONE_CACHE_DIR: /data/cache
    volumes:
      - minio-data:/data
      - /root/.config/rclone:/config/rclone
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9000"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  redis-data:
  minio-data:
